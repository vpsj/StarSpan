<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Distance Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="booking">
        <div class="section-center">

            <div class="container">

                <div class="booking-form">

    <!-- =====================================================
         TABS
         ===================================================== -->

    <div class="tabs">

        <button
            type="button"
            class="tab-button active"
            data-tab="distance-calculator-tab">
            Star Distance Calculator
        </button>

        <button
            type="button"
            class="tab-button"
            data-tab="star-hopper-tab">
            Star Hopper
        </button>

    </div>


    <!-- =====================================================
         STAR DISTANCE CALCULATOR
         ===================================================== -->

    <div
        id="distance-calculator-tab"
        class="tab-content active">

        <div class="form-header">
            <h1>Star Distance Calculator</h1>
            <p>How far apart are the stars?</p>
        </div>


        <form id="star-form">

            <div class="row">

                <div class="form-group autocomplete-group">
                    <label class="form-label" for="star1">
                        Star 1
                    </label>

                    <input
                        class="form-control"
                        id="star1"
                        name="Star1"
                        type="text"
                        placeholder="Enter the name of the First Star"
                        autocomplete="off"
                        required
                    >

                    <div
                        id="suggestions1"
                        class="suggestions">
                    </div>
                </div>


                <div class="form-group autocomplete-group">
                    <label class="form-label" for="star2">
                        Star 2
                    </label>

                    <input
                        class="form-control"
                        id="star2"
                        name="Star2"
                        type="text"
                        placeholder="Enter the name of the Second Star"
                        autocomplete="off"
                        required
                    >

                    <div
                        id="suggestions2"
                        class="suggestions">
                    </div>
                </div>

            </div>


            <div class="form-btn">
                <button
                    type="submit"
                    class="submit-btn">
                    Calculate
                </button>
            </div>

        </form>


        <div
            id="result"
            class="result"
            aria-live="polite">
        </div>


        <div
            id="star-map"
            class="star-map">
        </div>

    </div>


<!-- =====================================================
     STAR HOPPER
     ===================================================== -->

<div
    id="star-hopper-tab"
    class="tab-content">

    <div class="form-header">
        <h1>Star Hopper</h1>
        <p>Choose your route through the stars.</p>
    </div>


    <div id="star-hopper-form">

        <div
            id="hopper-fields"
            class="hopper-fields">


            <!-- =================================================
                 STAR HOP 1
                 ================================================= -->

            <div
                class="form-group autocomplete-group hopper-field"
                data-star-number="1">

                <label
                    class="form-label"
                    for="hopper-star-1">
                    Star 1
                </label>

                <input
                    class="form-control"
                    id="hopper-star-1"
                    name="HopperStar1"
                    type="text"
                    placeholder="Enter the name of the First Star"
                    autocomplete="off"
                >

                <div
                    id="hopper-suggestions-1"
                    class="suggestions">
                </div>

            </div>


            <!-- =================================================
                 STAR HOP 2
                 ================================================= -->

            <div
                class="form-group autocomplete-group hopper-field"
                data-star-number="2">

                <label
                    class="form-label"
                    for="hopper-star-2">
                    Star 2
                </label>

                <input
                    class="form-control"
                    id="hopper-star-2"
                    name="HopperStar2"
                    type="text"
                    placeholder="Enter the name of the Second Star"
                    autocomplete="off"
                >

                <div
                    id="hopper-suggestions-2"
                    class="suggestions">
                </div>

            </div>


                </div>


        <!-- =====================================================
             START FROM Sol
             ===================================================== -->

        <div class="hopper-start-option">

            <label class="hopper-start-checkbox">

                <input
                    type="checkbox"
                    id="hopper-start-from-sun"
                >

                <span>Start from Sol</span>

            </label>

        </div>


        <!-- =====================================================
             ADD STAR
             ===================================================== -->

        <div class="hopper-add-btn">

            <button
                type="button"
                id="add-hopper-star">
                + Add Star
            </button>

        </div>


        <!-- =====================================================
             CALCULATE ROUTE
             ===================================================== -->

        <div class="form-btn hopper-submit-btn">

            <button
                type="button"
                id="calculate-hopper">
                Calculate Route
            </button>

        </div>


        <!-- =====================================================
             HOPPER RESULTS
             ===================================================== -->

        <div
             id="hopper-result"
              class="result"
              aria-live="polite">
        </div>

        <div
             id="hopper-star-map"
             class="star-map">
        </div>

    </div>

</div>

</div>

            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
    <script src="star-hopper.js"></script>  

</body>

</html>
