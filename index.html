<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Distance Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="booking">
        <div class="section-center">

            <div class="container">

                <div class="booking-form">

    <!-- =====================================================
         TABS
         ===================================================== -->

    <div class="tabs">

        <button
            type="button"
            class="tab-button active"
            data-tab="distance-calculator-tab">
            Star Distance Calculator
        </button>

        <button
            type="button"
            class="tab-button"
            data-tab="star-hopper-tab">
            Star Hopper
        </button>

    </div>


    <!-- =====================================================
         STAR DISTANCE CALCULATOR
         ===================================================== -->

    <div
        id="distance-calculator-tab"
        class="tab-content active">

        <div class="form-header">
            <h1>Star Distance Calculator</h1>
            <p>How far apart are the stars?</p>
        </div>


        <form id="star-form">

            <div class="row">

                <div class="form-group autocomplete-group">
                    <label class="form-label" for="star1">
                        Star 1
                    </label>

                    <input
                        class="form-control"
                        id="star1"
                        name="Star1"
                        type="text"
                        placeholder="Enter the name of the First Star"
                        autocomplete="off"
                        required
                    >

                    <div
                        id="suggestions1"
                        class="suggestions">
                    </div>
                </div>


                <div class="form-group autocomplete-group">
                    <label class="form-label" for="star2">
                        Star 2
                    </label>

                    <input
                        class="form-control"
                        id="star2"
                        name="Star2"
                        type="text"
                        placeholder="Enter the name of the Second Star"
                        autocomplete="off"
                        required
                    >

                    <div
                        id="suggestions2"
                        class="suggestions">
                    </div>
                </div>

            </div>


            <div class="form-btn">
                <button
                    type="submit"
                    class="submit-btn">
                    Calculate
                </button>
            </div>

        </form>


        <div
            id="result"
            class="result"
            aria-live="polite">
        </div>


        <div
            id="star-map"
            class="star-map">
        </div>

    </div>


    <!-- =====================================================
         STAR HOPPER
         ===================================================== -->

    <div
        id="star-hopper-tab"
        class="tab-content">

        <!-- Star Hopper will be added in the next step -->

    </div>

</div>

            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>

</body>

</html>
